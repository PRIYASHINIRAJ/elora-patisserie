# Render Blueprint for the Élora Patisserie API (server/ folder).
# Render → New → Blueprint → pick this repo. It reads this file.
services:
  - type: web
    name: elora-patisserie-api
    runtime: node
    rootDir: server
    # Free plan: no persistent disk, so the SQLite database and uploaded files
    # reset whenever the service restarts, sleeps, or redeploys. The sample
    # cakes/portfolio are re-created on every start by seed.js.
    # To keep data permanently, switch to `plan: starter` and add:
    #   disk: { name: elora-data, mountPath: /var/data, sizeGB: 1 }
    # plus env vars DB_PATH=/var/data/elora.sqlite and UPLOADS_DIR=/var/data/uploads
    plan: free
    region: singapore
    buildCommand: npm install
    # seed.js is safe to re-run: it only creates the admin and sample cakes if missing.
    startCommand: node database/seed.js && node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: DELIVERY_FEE
        value: "25"
      # Filled in on the Render dashboard (you'll be asked when creating it).
      - key: CLIENT_URL
        sync: false
      - key: ADMIN_SEED_EMAIL
        sync: false
      - key: ADMIN_SEED_PASSWORD
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
